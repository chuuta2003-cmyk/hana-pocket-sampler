<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#14162b"><title>HANA POCKET SAMPLER</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Helvetica Neue',sans-serif}*{box-sizing:border-box}html,body{margin:0;background:#101322;color:#fff;min-height:100%;overscroll-behavior:none}body{display:flex;justify-content:center}main{width:min(100%,850px);padding:20px 16px 30px;user-select:none;-webkit-user-select:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(22px,5.2vw,36px);letter-spacing:.03em;margin:0;font-weight:900}h1 span{color:#ffa74b} .tag{font-size:12px;color:#bdc3d7;margin:5px 0 0}.pill{background:#273151;padding:7px 10px;border-radius:30px;font-size:11px;color:#c5d2ff;white-space:nowrap}.panel{border:1px solid #313951;background:linear-gradient(140deg,#202744,#151a2e);border-radius:20px;padding:17px;margin-top:18px;box-shadow:0 12px 26px #0002}.control{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.btn{border:0;color:#fff;background:#374265;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:800;touch-action:manipulation;cursor:pointer}.btn:disabled{opacity:.38}.primary{background:#f3536e}.primary.recording{background:#a71136;animation:pulse 1s infinite}.secondary{background:#44527b}.small{padding:9px 12px;font-size:13px}@keyframes pulse{50%{box-shadow:0 0 0 7px #f3536e33}}.status{margin:12px 0 0;min-height:30px;font-size:14px;color:#d6e0f7;line-height:1.5}.settings{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:13px}.settings label{display:flex;align-items:center;gap:8px;color:#cad3eb;font-size:13px}select,input[type=range]{accent-color:#f6ad51}select{color:white;background:#333e60;border:1px solid #586382;border-radius:9px;padding:7px;font-size:14px}.kbd-wrap{position:relative;margin-top:20px;padding:10px 8px 12px;border-radius:17px;background:#0b1020;border:1px solid #30374c;touch-action:none}.keys{display:flex;position:relative;height:clamp(190px,38vw,290px);gap:2px}.white{position:relative;flex:1;min-width:0;border:1px solid #c1c8d7;background:linear-gradient(#fff,#dce2ec);border-radius:0 0 9px 9px;color:#5d6474;display:flex;align-items:end;justify-content:center;padding-bottom:12px;font-size:12px;font-weight:800;touch-action:none}.white.active{background:linear-gradient(#ffd18b,#e8a24f)}.white.root{color:#b3474d}.black{position:absolute;width:calc(100% / 14 * .60);height:60%;top:0;z-index:2;transform:translateX(-50%);background:linear-gradient(#3a435a,#080a12 70%);border:1px solid #0a0e15;border-radius:0 0 6px 6px;box-shadow:1px 5px 5px #0007;touch-action:none}.black.active{background:linear-gradient(#ffb665,#b34f4c)}.hint{font-size:12px;color:#8996b4;margin:12px 0 0;line-height:1.65}.meter{height:5px;background:#303650;border-radius:7px;overflow:hidden;flex:1;min-width:75px}.meter>div{height:100%;width:0;background:#ffd078;transition:width .08s}.time{font-size:13px;color:#cbd2e6;font-variant-numeric:tabular-nums}.foot{color:#9ba7c3;text-align:center;font-size:12px;padding:22px 0}.file{display:none}.wave{font-size:12px;color:#ffa74b;font-weight:700} @media(max-width:480px){main{padding:15px 9px}.panel{padding:13px}.white{font-size:10px}.btn{padding:12px 13px;font-size:14px}.keys{height:225px}}
</style></head><body><main><header><div><h1>HANA <span>POCKET</span><br>SAMPLER</h1><p class="tag">録って、弾くだけ。ポケットに入る音のおもちゃ。</p></div><div class="pill">WEB INSTRUMENT</div></header>
<section class="panel"><div class="control"><button id="rec" class="btn primary">● 録音する</button><button id="stop" class="btn secondary" disabled>■ 録音終了</button><button id="load" class="btn small">音声ファイル</button><input id="file" class="file" type="file" accept="audio/*"><div class="meter"><div id="meter"></div></div><span id="time" class="time">0.0 秒</span></div><p id="status" class="status" aria-live="polite">まず音をひとつ録音してみよう。短い声や口笛がおすすめ。</p><div class="settings"><label>録音音の鍵盤 <select id="root"><option value="48">C3</option><option value="60" selected>C4</option><option value="72">C5</option><option value="69">A4</option></select></label><label>音量 <input id="volume" type="range" min="0" max="100" value="75"></label><label><input id="loop" type="checkbox"> ループ</label></div></section>
<section class="kbd-wrap"><div id="keys" class="keys" aria-label="2オクターブ演奏鍵盤"></div></section><p class="hint">C3〜B4の2オクターブ。鍵盤を押している間だけ音が鳴ります。複数音にも対応。長い録音でも使えますが、短い単音がいちばん楽しい！</p><p class="hint">※ 録音音自体の音程は自動検出しません。「録音音の鍵盤」を選んで、そこを基準に移調します。録音は端末内で処理し、サーバーへ送りません。</p><footer class="foot">HANA instruments · Made for fun ♫</footer></main><script>
(()=>{'use strict';let ctx,buffer=null,stream=null,recorder=null,chunks=[],tick=null,started=0,voices=new Map(),recordTimeout=null;const $=id=>document.getElementById(id),status=$('status'),rec=$('rec'),stop=$('stop'),meter=$('meter'),clock=$('time'),root=$('root'),loop=$('loop'),volume=$('volume'),keys=$('keys');const noteNames=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];const semis=[0,2,4,5,7,9,11];const msg=s=>status.textContent=s;const init=async()=>{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state!=='running')await ctx.resume();};const noteName=n=>noteNames[n%12]+(Math.floor(n/12)-1);const kb=[];for(let n=48;n<72;n++){if(semis.includes(n%12)){const b=document.createElement('div');b.className='white';b.dataset.note=n;b.textContent=noteName(n);keys.appendChild(b);kb.push({n,el:b});}}for(let n=48;n<72;n++){if(!semis.includes(n%12)){const b=document.createElement('div');b.className='black';b.dataset.note=n;const prior=kb.filter(x=>x.n<n).length;b.style.left=`calc(${prior} * 100% / 14 - 1px)`;keys.appendChild(b);kb.push({n,el:b});}}const updateRoot=()=>{kb.forEach(x=>x.el.classList.toggle('root',x.n===+root.value));};root.onchange=updateRoot;updateRoot();let animationId=0;function release(v){if(!v)return;const now=ctx.currentTime;try{v.gain.gain.cancelScheduledValues(now);v.gain.gain.setTargetAtTime(0,now,.022);v.source.stop(now+.12);}catch(_){}}function stopVoice(id){const v=voices.get(id);if(!v)return;release(v);voices.delete(id);if(![...voices.values()].some(t=>t.n===v.n))keys.querySelector(`[data-note="${v.n}"]`)?.classList.remove('active');}async function play(id,n){if(!buffer)return msg('先に録音するか、音声ファイルを読み込んでね。');await init();stopVoice(id);const source=ctx.createBufferSource(),gain=ctx.createGain(),now=ctx.currentTime;source.buffer=buffer;source.playbackRate.value=Math.pow(2,(n-(+root.value))/12);source.loop=loop.checked;if(source.loop){source.loopStart=0;source.loopEnd=buffer.duration;}gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime((+volume.value/100)*.75,now+.012);source.connect(gain).connect(ctx.destination);source.start();const voice={source,gain,n};voices.set(id,voice);keys.querySelector(`[data-note="${n}"]`)?.classList.add('active');source.onended=()=>{if(voices.get(id)===voice){voices.delete(id);keys.querySelector(`[data-note="${n}"]`)?.classList.remove('active');}};}
keys.addEventListener('pointerdown',e=>{const k=e.target.closest('[data-note]');if(!k)return;e.preventDefault();k.setPointerCapture(e.pointerId);play(e.pointerId,+k.dataset.note).catch(err=>msg('再生できません: '+err.message));});keys.addEventListener('pointerup',e=>stopVoice(e.pointerId));keys.addEventListener('pointercancel',e=>stopVoice(e.pointerId));keys.addEventListener('lostpointercapture',e=>stopVoice(e.pointerId));window.addEventListener('blur',()=>{for(const id of [...voices.keys()])stopVoice(id);});async function decode(blob){await init();const data=await blob.arrayBuffer();buffer=await ctx.decodeAudioData(data);if(!buffer.duration)throw Error('音声が空です');msg(`録音OK！ ${buffer.duration.toFixed(1)}秒。さあ鍵盤を弾いてみよう 🎹`);clock.textContent=buffer.duration.toFixed(1)+' 秒';meter.style.width='100%';}
async function startRec(){try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('このブラウザはマイク録音に対応していません。HTTPSのURLをSafariで開いてください。');await init();for(const id of [...voices.keys()])stopVoice(id);stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});chunks=[];const types=['audio/mp4','audio/webm;codecs=opus','audio/webm'];const mime=types.find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onerror=e=>msg('録音エラー: '+(e.error?.message||'不明'));recorder.onstop=async()=>{clearInterval(tick);clearTimeout(recordTimeout);stream?.getTracks().forEach(t=>t.stop());stream=null;rec.disabled=false;rec.classList.remove('recording');stop.disabled=true;try{if(!chunks.length)throw Error('データがありません');await decode(new Blob(chunks,{type:recorder.mimeType||'audio/mp4'}));}catch(e){msg('録音の読み込みに失敗: '+e.message);}};recorder.start();started=Date.now();rec.disabled=true;rec.classList.add('recording');stop.disabled=false;msg('録音中… 音を入れて「録音終了」を押してね（最長10秒）。');tick=setInterval(()=>{const t=(Date.now()-started)/1000;clock.textContent=t.toFixed(1)+' 秒';meter.style.width=(t/10*100)+'%';},100);recordTimeout=setTimeout(stopRec,10000);}catch(e){stream?.getTracks().forEach(t=>t.stop());stream=null;msg('マイクが使えません: '+e.message+'（Safariのマイク許可を確認）');}}function stopRec(){if(recorder?.state==='recording')recorder.stop();}rec.onclick=startRec;stop.onclick=stopRec;$('load').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{await decode(f);}catch(err){msg('読み込めません: '+err.message);}e.target.value='';};document.addEventListener('visibilitychange',()=>{if(document.hidden)for(const id of [...voices.keys()])stopVoice(id);});})();
</script></body></html>
